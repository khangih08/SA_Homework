services:
  # 1. PostgreSQL Database cho User Service
  users-db:
    image: postgres:16-alpine
    container_name: users_db_postgres
    restart: always
    environment:
      POSTGRES_DB: ${USERS_DB_NAME:-users_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - users_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_net

  # 2. PostgreSQL Database cho Order Service
  orders-db:
    image: postgres:16-alpine
    container_name: orders_db_postgres
    restart: always
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - orders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_net

  # 3. MinIO Object Storage
  minio:
    image: elestio/minio:latest
    container_name: minio_storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_net

  # 4. Tự động tạo bucket user-avatars nếu chưa tồn tại
  minio-init:
    image: elestio/minio:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadminpassword};
      /usr/bin/mc mb myminio/$${MINIO_BUCKET_NAME:-user-avatars} --ignore-existing;
      echo 'MinIO bucket user-avatars initialized successfully';
      exit 0;
      "
    networks:
      - microservices_net

  # 5. User Service (Spring Boot)
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user_service_app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/${USERS_DB_NAME:-users_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:-MicroservicesAppSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      JWT_ISSUER: ${JWT_ISSUER:-microservices-app}
      ORDER_SERVICE_URL: http://order-service:8082
      MINIO_INTERNAL_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-user-avatars}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      users-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - microservices_net

  # 6. Order Service (Spring Boot)
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order_service_app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/${ORDERS_DB_NAME:-orders_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      JWT_SECRET: ${JWT_SECRET:-MicroservicesAppSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!}
      JWT_ISSUER: ${JWT_ISSUER:-microservices-app}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      orders-db:
        condition: service_healthy
    networks:
      - microservices_net

  # 7. Nginx API Gateway (Cổng duy nhất mở ra ngoài)
  api-gateway:
    image: nginx:alpine
    container_name: api_gateway_nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - order-service
    networks:
      - microservices_net

volumes:
  users_pg_data:
  orders_pg_data:
  minio_data:

networks:
  microservices_net:
    driver: bridge
