events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;

    # Custom log format - tuyệt đối KHÔNG ghi Authorization header / JWT token vào log
    log_format gateway_log '$remote_addr - $remote_user [$time_local] "$request" '
                           '$status $body_bytes_sent "$http_referer" '
                           '"$http_user_agent" rt=$request_time '
                           'uct="$upstream_connect_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log gateway_log;
    error_log  /var/log/nginx/error.log warn;

    # Rate Limiting: 10 requests / second based on client IP
    # Sử dụng thuật toán Leaky Bucket qua limit_req_zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Upstreams cho các microservices nội bộ
    upstream user-backend {
        server user-service:8081;
        keepalive 32;
    }

    upstream order-backend {
        server order-service:8082;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Timeouts hợp lý
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # Xử lý trang lỗi trả JSON đồng nhất
        error_page 401 = @error401;
        location @error401 {
            default_type application/json;
            return 401 '{"status":401,"message":"Yêu cầu xác thực không hợp lệ hoặc token đã hết hạn (Gateway)","timestamp":"$time_iso8601"}';
        }

        error_page 429 = @error429;
        location @error429 {
            default_type application/json;
            return 429 '{"status":429,"message":"Quá nhiều yêu cầu. Vui lòng thử lại sau (Rate limit 10r/s)","timestamp":"$time_iso8601"}';
        }

        error_page 502 = @error502;
        location @error502 {
            default_type application/json;
            return 502 '{"status":502,"message":"Dịch vụ backend tạm thời không thể kết nối (Bad Gateway)","timestamp":"$time_iso8601"}';
        }

        error_page 504 = @error504;
        location @error504 {
            default_type application/json;
            return 504 '{"status":504,"message":"Dịch vụ backend phản hồi quá hạn (Gateway Timeout)","timestamp":"$time_iso8601"}';
        }

        # Subrequest xác thực nội bộ cho JWT Offloading
        location = /_auth_verify {
            internal;
            proxy_pass http://user-backend/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host user-service;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;

            # Xóa các header giả mạo từ client
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        # 1. Public Authentication Endpoints (Register & Login) - Không yêu cầu JWT
        location /auth/register {
            limit_req zone=api_limit;

            proxy_pass http://user-backend/auth/register;
            proxy_set_header Host user-service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        location /auth/login {
            limit_req zone=api_limit;

            proxy_pass http://user-backend/auth/login;
            proxy_set_header Host user-service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
        }

        # Chặn truy cập trực tiếp từ client vào endpoint verify nội bộ
        location /auth/verify {
            return 404 '{"status":404,"message":"Endpoint không tồn tại hoặc không thể truy cập công khai","timestamp":"$time_iso8601"}';
        }

        # 2. User Service Endpoints - Yêu cầu xác thực JWT qua auth_request
        location /users {
            limit_req zone=api_limit;

            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://user-backend;
            proxy_set_header Host user-service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward header danh tính đã được Gateway xác thực
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            # Forward Authorization header cho backend tự kiểm tra (defense in depth)
            proxy_set_header Authorization $http_authorization;
        }

        # 3. Order Service Endpoints - Yêu cầu xác thực JWT qua auth_request
        location /orders {
            limit_req zone=api_limit;

            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://order-backend;
            proxy_set_header Host order-service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Forward header danh tính đã được Gateway xác thực
            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            # Forward Authorization header cho Order Service tự xác thực (defense in depth)
            proxy_set_header Authorization $http_authorization;
        }

        # 4. Dashboard Aggregation Endpoint - Yêu cầu xác thực JWT qua auth_request
        location /dashboard {
            limit_req zone=api_limit;

            auth_request /_auth_verify;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            auth_request_set $auth_user_role $upstream_http_x_user_role;

            proxy_pass http://user-backend;
            proxy_set_header Host user-service;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-User-Id $auth_user_id;
            proxy_set_header X-User-Role $auth_user_role;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
