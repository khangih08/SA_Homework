server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:users_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgrespassword}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET:MicroservicesAppSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  issuer: ${JWT_ISSUER:microservices-app}

order-service:
  url: ${ORDER_SERVICE_URL:http://localhost:8082}

minio:
  internal-endpoint: ${MINIO_INTERNAL_ENDPOINT:http://localhost:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
  bucket-name: ${MINIO_BUCKET_NAME:user-avatars}

